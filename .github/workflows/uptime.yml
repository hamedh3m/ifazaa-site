# فحص كل ٥ دقايق: فزعة، أبو محمد، والموقع، وموقع نابيكس ولوحتها، والنسخة الاحتياطية برا السيرفر (تنبيه لو تأخرت أكثر من يومين). لو واحد ما رد ٣ مرات ورا بعض، الفحص يفشل
# وGitHub يرسل لحامد إيميل وتنبيه على جواله (تطبيق GitHub).
# اختياري: لو انضاف ALERT_TELEGRAM_TOKEN و ALERT_TELEGRAM_CHAT في Secrets يوصل التنبيه على تيليجرام بعد.
name: uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Fazaa, Abu Mohammed and the site
        env:
          TG_TOKEN: ${{ secrets.ALERT_TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.ALERT_TELEGRAM_CHAT }}
        run: |
          check() {
            for i in 1 2 3; do
              out=$(curl -fsS -m 15 "$1" 2>/dev/null) && echo "$out" | grep -q "$2" && return 0
              sleep 20
            done
            return 1
          }
          down=""
          check https://api.ifazaa.com/health '"running":true' || down="$down فزعة"
          check https://h3m.tail450117.ts.net/health '"ok":true' || down="$down أبو-محمد"
          check https://ifazaa.com/ 'ifazaa' || down="$down الموقع"
          check https://nabix.sa/ 'Nabix' || down="$down موقع-نابيكس"
          check https://panel.nabix.sa/ 'X-Panel' || down="$down لوحة-نابيكس"
          # النسخة الاحتياطية برا السيرفر: لو آخر نسخة وصلت قبل أكثر من يومين، ننبّه
          age=$(curl -fsS -m 15 https://api.ifazaa.com/health 2>/dev/null | python3 -c "import sys,json;a=json.load(sys.stdin).get('backup_age_days');print('' if a is None else a)" 2>/dev/null || true)
          if [ -n "$age" ] && [ "$age" -gt 2 ]; then down="$down النسخ-الاحتياطية(آخر-نسخة-قبل-${age}-يوم)"; fi
          if [ -n "$down" ]; then
            echo "::error::ما يرد:$down"
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              curl -fsS -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" \
                --data-urlencode "text=🚨 السيرفر: ما يرد:${down}. شيّك على Lightsail." >/dev/null || true
            fi
            exit 1
          fi
          echo "كله شغال ✅"
