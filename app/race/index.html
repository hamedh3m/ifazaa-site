<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#07070a">
<title>سباق الطاقم · Crew Race</title>
<style>
:root{--bg:#07070a;--s1:rgba(255,255,255,.05);--s2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--ink:#f7f7f4;--muted:#a1a1aa;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:Almarai,-apple-system,system-ui,sans-serif;min-height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.33;animation:float 18s ease-in-out infinite alternate}
.sky i:nth-child(1){background:#ff2d4b;top:-25vmax;inset-inline-start:-15vmax}
.sky i:nth-child(2){background:#3d8bff;bottom:-30vmax;inset-inline-end:-20vmax;animation-delay:-6s;opacity:.25}
.sky i:nth-child(3){background:#22e07a;top:30%;inset-inline-end:-30vmax;animation-delay:-11s;opacity:.12}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:12px auto 6px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#ff4d66,#b5001d);display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;box-shadow:0 8px 24px rgba(255,45,75,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-size:19px;font-weight:800;line-height:1.05}
.lvl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:700;margin-top:4px}
.lvl b{background:linear-gradient(90deg,#ffd76a,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.xpbar{width:54px;height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#ff9f1c);border-radius:9px;transition:width .6s var(--ease)}
.tools{display:flex;gap:6px}
.pill{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.wrap{max-width:640px;margin:0 auto;padding-bottom:28px}
.hero{position:relative;margin:12px 0 14px;border-radius:28px;padding:22px 20px 20px;overflow:hidden;min-height:190px}
.hero h2{font-size:31px;font-weight:800;line-height:1.2;max-width:68%;position:relative;z-index:1}
.hero h2 em{font-style:normal;background:linear-gradient(90deg,#ff5a72,#ffc933);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#d4d4d8;font-size:14.5px;margin-top:8px;max-width:60%;line-height:1.7;position:relative;z-index:1}
.hero .pins{position:absolute;inset-inline-end:6px;bottom:4px;width:150px;height:160px}
.hero .pins svg{position:absolute;width:60px;overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5));animation:bob 2.6s ease-in-out infinite}
.hero .pins svg:nth-child(1){inset-inline-start:40px;top:0}
.hero .pins svg:nth-child(2){inset-inline-start:88px;top:40px;animation-delay:-.7s;width:54px}
.hero .pins svg:nth-child(3){inset-inline-start:0;top:56px;animation-delay:-1.4s;width:52px}
.hero .pins svg:nth-child(4){inset-inline-start:50px;top:84px;animation-delay:-2s;width:50px}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{position:relative;text-align:start;border-radius:22px;padding:16px 14px 14px;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .2s var(--spring)}
.mode:active{transform:scale(.97)}
.mode .ic{position:absolute;top:12px;inset-inline-start:12px;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.mode b{font-size:16.5px;font-weight:800}
.mode small{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.mode.wide{grid-column:1/-1;min-height:78px;justify-content:center;padding-inline-start:68px}
.mode.wide .ic{top:50%;translate:0 -50%}
.mode.big{grid-column:1/-1;min-height:118px;background:linear-gradient(135deg,#ff2d4b,#a8001c);border:0;box-shadow:0 18px 40px -16px rgba(255,45,75,.7)}
.mode.big::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.mode.big small{color:rgba(255,255,255,.85)}
.mode.big .ic{background:rgba(255,255,255,.18)}
.mode.big .live{position:absolute;top:16px;inset-inline-end:14px;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);padding:5px 10px;border-radius:99px}
.mode.big .live i{width:7px;height:7px;border-radius:50%;background:#7dffb0;animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(125,255,176,.7)}70%,100%{box-shadow:0 0 0 8px rgba(125,255,176,0)}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h3{font-size:15px}
.skins{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.skin{flex:none;width:112px;border-radius:18px;padding:8px;text-align:center;font-size:12.5px;font-weight:700;position:relative}
.skin svg{width:100%;aspect-ratio:1;border-radius:12px;display:block;margin-bottom:6px}
.skin.on{outline:2px solid var(--ink)}
.skin.lock{opacity:.55}.skin.lock::after{content:"🔒";position:absolute;top:12px;inset-inline-end:12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:18px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat small{color:var(--muted);font-size:11.5px}
.daily{border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;margin-top:10px}
.daily .ring{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;position:relative}
.daily .ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#15151b}
.daily .ring span{position:relative}
.daily b{font-size:14.5px}.daily small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rules{color:var(--muted);font-size:12.5px;line-height:1.8;margin-top:16px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet .panel{width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);background:#121217;border:1px solid var(--line);animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(40%);opacity:0}}@keyframes fade{from{opacity:0}}
.panel h3{font-size:20px;margin-bottom:6px}.panel p{color:var(--muted);font-size:14px;line-height:1.7}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.opt{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:8px}
.opt .dots{display:flex;gap:4px}.opt .dots i{width:10px;height:10px;border-radius:50%}
.opt.on{border-color:var(--ink);background:var(--s2)}
.go{width:100%;border-radius:18px;padding:16px;font-size:17px;font-weight:800;background:var(--ink);color:#000;transition:transform .15s}
.go:active{transform:scale(.98)}.go.red{background:linear-gradient(135deg,#ff2d4b,#c4001f);color:#fff}
.ghost{width:100%;margin-top:8px;padding:13px;border-radius:16px;color:var(--muted);font-weight:700}
.code{font-size:40px;font-weight:800;letter-spacing:.3em;text-align:center;margin:12px 0;direction:ltr;font-family:ui-monospace,Menlo,monospace}
.radar{width:150px;height:150px;margin:10px auto 14px;border-radius:50%;position:relative;background:radial-gradient(circle,rgba(255,45,75,.18),transparent 70%);display:grid;place-items:center;font-size:34px}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,45,75,.55);animation:wave 2s ease-out infinite}
.radar::after{animation-delay:1s}
@keyframes wave{from{transform:scale(.4);opacity:1}to{transform:scale(1.25);opacity:0}}
.lob{display:flex;justify-content:center;gap:10px;margin:14px 0}
.lob .av{width:52px;height:52px;font-size:13px}
.lob .av.empty{background:var(--s1)!important;border:2px dashed var(--line);color:var(--muted)}
.game{max-width:640px;margin:0 auto;padding-bottom:16px}
.stage{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}
.pp{direction:rtl;position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;min-height:66px;transition:all .3s var(--ease);opacity:.55}
html[dir=ltr] .pp{direction:ltr}
.pp.empty{visibility:hidden}
.pp.on{opacity:1;border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset,0 10px 30px -10px var(--pc);transform:translateY(-2px)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.35)}
.av .tm{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--pc) calc(var(--p,1)*360deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 24px,#000 25px);mask:radial-gradient(circle,transparent 24px,#000 25px);opacity:0;transition:opacity .2s}
.pp.on .av .tm.run{opacity:1}
.pp .info{flex:1;min-width:0}.pp .info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .info small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap}
.pp .homes{display:flex;gap:3px;margin-top:4px}.pp .homes i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12)}.pp .homes i.in{background:var(--pc);box-shadow:0 0 8px var(--pc)}
.pp .bubble{position:absolute;top:-20px;inset-inline-start:26px;font-size:32px;animation:pop2 1.8s var(--spring) forwards;pointer-events:none;z-index:3}
@keyframes pop2{0%{transform:scale(0) translateY(10px)}15%{transform:scale(1.25)}25%{transform:scale(1)}80%{opacity:1;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-26px)}}
.dbox{width:52px;height:52px;perspective:300px;flex:none;visibility:hidden}
.pp.on .dbox{visibility:visible}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.cube.ready{cursor:pointer;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{translate:0 -5px}}
.cube.spin{animation:tumble .65s cubic-bezier(.3,.7,.3,1)}
@keyframes tumble{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(720deg) rotateY(540deg)}}
.face{position:absolute;inset:0;border-radius:12px;background:linear-gradient(145deg,#fff,#e4e4e7);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -4px 6px rgba(0,0,0,.12);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face i{width:9px;height:9px;border-radius:50%;background:#18181b;place-self:center;visibility:hidden}
.face i.v{visibility:visible}.face.one i.v{background:#ff2d4b;width:12px;height:12px}
.f1{transform:translateZ(26px)}.f6{transform:rotateY(180deg) translateZ(26px)}.f2{transform:rotateY(90deg) translateZ(26px)}
.f5{transform:rotateY(-90deg) translateZ(26px)}.f3{transform:rotateX(90deg) translateZ(26px)}.f4{transform:rotateX(-90deg) translateZ(26px)}
.boardw{position:relative;width:100%;aspect-ratio:1;border-radius:26px;padding:9px;
  background:linear-gradient(160deg,#26262e,#0c0c10);box-shadow:0 2px 0 #3a3a44 inset,0 -10px 0 #050507 inset,0 40px 60px -28px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.06)}
.boardw.shake{animation:shake .45s}
@keyframes shake{20%{translate:-6px 0}40%{translate:6px 2px}60%{translate:-4px -2px}80%{translate:3px 0}}
#board{width:100%;height:100%;display:block;touch-action:manipulation;overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.tok{transition:transform .17s var(--ease)}
.tok.fly{transition:transform .6s var(--ease)}
.tok .pin{transform-box:fill-box;transform-origin:50% 100%}
.tok.hop .pin{animation:hop .17s ease-out}
@keyframes hop{50%{transform:translateY(-.28px) scale(1.08,1.04)}}
.tok.can{cursor:pointer}.tok.can .glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{opacity:.15}}
.tok.can .pin{animation:pinbob .9s ease-in-out infinite}
@keyframes pinbob{50%{transform:translateY(-.12px)}}
.say{min-height:26px;text-align:center;font-size:15px;font-weight:800;color:#ffe7a8;transition:opacity .3s;text-shadow:0 2px 12px rgba(255,201,51,.35)}
.react{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.react button{width:44px;height:44px;border-radius:14px;font-size:22px;transition:transform .15s var(--spring)}
.react button:active{transform:scale(1.3)}
.links{display:flex;justify-content:center;gap:8px}
.links button{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700}
.win{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:30;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.win.on{display:flex}
.win .card{max-width:360px;width:100%;text-align:center;padding:28px 20px;border-radius:28px;animation:pop .5s var(--spring)}
.win .big{font-size:70px;line-height:1;filter:drop-shadow(0 10px 30px rgba(255,201,51,.5))}
.win h2{font-size:26px;margin:12px 0 4px}.win p{color:var(--muted);font-size:14px}
.win .xp{margin:14px 0 18px;font-weight:800;color:#ffd76a;min-height:20px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.conf{position:fixed;top:-14px;width:9px;height:15px;border-radius:2px;z-index:31;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);z-index:40;padding:12px 18px;border-radius:16px;background:#f7f7f4;color:#000;font-weight:800;font-size:14px;animation:up .3s var(--ease);max-width:90vw;text-align:center}
@media (min-width:900px) and (min-height:600px){
  .top,.game{max-width:1080px}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto auto 1fr auto;gap:12px 22px;align-items:start}
  .bw{grid-column:1;grid-row:1/6;width:min(100%,calc(100vh - 100px));margin-inline:auto}
  .prow{grid-column:2;grid-template-columns:1fr;direction:inherit}
  .say,.react,.links{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky"><i></i><i></i><i></i></div>
<div class="top">
  <div class="brand"><div class="logo">ف</div><div><h1 id="t-title"></h1><div class="lvl"><span id="t-lvl"></span> <b id="lvl-n"></b><span class="xpbar"><i id="xp-i"></i></span></div></div></div>
  <div class="tools"><button class="pill" id="snd"></button><button class="pill" id="lang"></button></div>
</div>

<div class="wrap" id="home">
  <div class="hero glass"><h2 id="t-hero"></h2><p id="t-sub"></p><div class="pins" id="hero-pins"></div></div>
  <div class="modes">
    <button class="mode big" id="m-find"><span class="ic">⚡</span><span class="live"><i></i><span id="t-live"></span></span><b id="t-find"></b><small id="t-find-s"></small></button>
    <button class="mode glass" id="m-friend"><span class="ic" style="background:rgba(34,224,122,.15)">🔗</span><b id="t-friend"></b><small id="t-friend-s"></small></button>
    <button class="mode glass" id="m-bot"><span class="ic" style="background:rgba(61,139,255,.15)">🤖</span><b id="t-bot"></b><small id="t-bot-s"></small></button>
    <button class="mode glass wide" id="m-local"><span class="ic" style="background:rgba(255,201,51,.15)">👨‍👩‍👧</span><b id="t-local"></b><small id="t-local-s"></small></button>
  </div>
  <div class="daily glass"><div class="ring" id="d-ring"><span>🎯</span></div><div><b id="d-t"></b><small id="d-s"></small></div></div>
  <div class="sec"><h3 id="t-skins"></h3></div>
  <div class="skins" id="skins"></div>
  <div class="sec"><h3 id="t-stats"></h3></div>
  <div class="stats"><div class="stat glass"><b id="st-w">0</b><small id="t-w"></small></div><div class="stat glass"><b id="st-p">0</b><small id="t-p"></small></div><div class="stat glass"><b id="st-c">0</b><small id="t-c"></small></div></div>
  <p class="rules" id="t-rules"></p>
</div>

<div class="game" id="game" hidden>
  <div class="stage">
    <div class="prow" id="row-a"></div>
    <div class="bw"><div class="boardw" id="boardw"><svg id="board" viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg"></svg><canvas id="fx"></canvas></div></div>
    <div class="prow" id="row-b"></div>
    <div class="say" id="say"></div>
    <div class="react" id="react"></div>
    <div class="links"><button id="leave"></button></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="win" id="win"><div class="card glass"><div class="big" id="win-emoji">🏆</div><h2 id="win-text"></h2><p id="win-sub"></p><div class="xp" id="win-xp"></div><button class="go" id="again"></button><button class="ghost" id="win-home"></button></div></div>

<script>
(() => {
"use strict";
const T = {
  ar: {title: "سباق الطاقم", lvl: "مستوى", hero: "مين <em>أسرع</em> واحد يوصّل طاقمه؟", sub: "العب ضد ناس حقيقيين أونلاين، أو تحدّى صاحبك برابط.",
       find: "دوّر لي خصم", findS: "نطابقك مع أي أحد يلعب الحين", live: "أونلاين", friend: "تحدّى صاحبك", friendS: "رابط ترسله بالواتساب",
       bot: "ضد فزعة", botS: "تدرّب بدون نت", local: "مع أهلك على نفس الجوال", localS: "مرّروا الجوال بينكم",
       skins: "شكل اللوحة", stats: "إنجازاتك", w: "فوز", p: "جولة", c: "أكلت", rules: "تحتاج 6 عشان تطلع قطعة. الـ6 تعطيك رمية ثانية، وإذا وقفت على قطعة خصم ترجعها لبيتها وتاخذ رمية. ★ ومربعات البداية آمنة. ثلاث ستات ورا بعض يروح الدور.",
       lang: "English", on: "🔊", off: "🔇", you: "أنت", anon: n => `فزعاوي ${n}`, bots: ["فزعة", "سند", "نخوة"], colors: ["الأحمر", "الأخضر", "الذهبي", "الأزرق"],
       tap: "ارمِ النرد", pick: "اختر قطعة", think: "يفكر…", home: n => `${n}/4 وصلت`, auto: "خلص وقتك، لعبنا عنك ⏱", sub2: "فزعة يكمل عنه",

  fx.globalAlpha = 1; if (parts.length) requestAnimationFrame(fxLoop);
}
function shake() { const b = $("boardw"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
let sayT = 0;
function say(arr) { const s = $("say"); s.textContent = Array.isArray(arr) ? pick(arr) : arr; s.style.opacity = 1; clearTimeout(sayT); sayT = setTimeout(() => s.style.opacity = 0, 2200); }
function bubble(pi, r) { const el = document.querySelector(`.pp[data-pi="${pi}"]`); if (!el) return; const b = document.createElement("span"); b.className = "bubble"; b.textContent = r; el.appendChild(b); SFX.pop(); setTimeout(() => b.remove(), 1900); }
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function confetti() { for (let i = 0; i < 90; i++) { const c = document.createElement("i"); c.className = "conf"; c.style.left = rnd() * 100 + "vw"; c.style.background = SK.col[i % 4]; c.style.animationDuration = 1.8 + rnd() * 1.8 + "s"; c.style.animationDelay = rnd() * .5 + "s"; document.body.appendChild(c); setTimeout(() => c.remove(), 4400); } }

// ---------- تحريك قطعة ----------
function animateMove(pi, k, from, to, caps, done) {
  const p = G.players[pi], steps = from < 0 ? [0] : Array.from({length: to - from}, (_, i) => from + i + 1);
  busy = true; G.moves = []; place(); status();
  let i = 0;
  const step = () => {
    p.tok[k] = steps[i++]; place(false, [pi, k]); SFX.step(i);
    if (i < steps.length) return later(step, 175);
    later(() => {
      if (caps && caps.length) {
        const [x, y] = cellOf(p.c, to, k);
        caps.forEach(([oi, j]) => { G.players[oi].tok[j] = -1; const g = TOK[oi][j]; g.classList.add("fly"); setTimeout(() => g.classList.remove("fly"), 700); });
        burst(x, y, SK.col[G.players[caps[0][0]].c]); shake(); SFX.cap(); buzz([20, 40, 30]); say(t().quips.cap);
        if (G.mode !== "local" && pi === G.me) { P.c += caps.length; const was = P.dc; P.dc += caps.length; saveP(); if (was < DAILY_GOAL && P.dc >= DAILY_GOAL) { addXP(40); toast(t().dailyDone); } }
      }
      if (to === LAST) { const [x, y] = FINISH[p.c]; burst(x, y, "#ffd76a", 34); SFX.home(); say(t().quips.home); }
      place(); busy = false; status(); done();
    }, 180);
  };
  step();
}

// ---------- محلي: ضد فزعة / نفس الجوال ----------
function localGame(mode, n) {
  online.stop(); clearTimers();
  const colors = n === 2 ? [0, 2] : [0, 1, 2, 3], humans = mode === "local" ? colors.length : 1;
  let bi = 0;
  G = {mode, me: 0, turn: 0, dice: 0, sixes: 0, phase: "roll", moves: [], over: false,
       players: colors.map((c, i) => { const bot = i >= humans; return {c, bot, fazaa: bot, me: i === 0 && humans === 1, tok: [-1, -1, -1, -1], name: bot ? t().bots[bi++] : humans > 1 ? t().colors[c] : t().you}; })};
  enterGame(); botMaybe();
}
const legal = (pl, d) => { const out = []; pl.tok.forEach((p, k) => { if (p < 0) { if (d === 6) out.push(k); } else if (p < LAST && p + d <= LAST) out.push(k); }); return out; };
function onRoll() {
  if (!G || busy || G.over || G.phase !== "roll" || !myTurn()) return;
  SFX.tap();
  if (G.mode === "online") { G.phase = "rolling"; status(); return online.act({a: "roll"}); }
  localRoll();
}
function localRoll() {
  const p = G.players[G.turn], d = 1 + Math.floor(rnd() * 6);
  busy = true; G.phase = "rolling"; status();
  spinCube(G.turn, d, () => {
    busy = false; G.dice = d;
    if (d === 6) { G.sixes++; if (G.sixes === 3) { say(t().quips.three); G.phase = "none"; status(); return later(nextTurn, 900); } }
    G.moves = legal(p, d);
    if (!G.moves.length) { G.phase = "none"; status(); return later(() => d === 6 ? again() : nextTurn(), 800); }
    if (d === 6) say(t().quips.six);
    G.phase = "move"; place(); status();
    if (p.bot) later(() => localMove(botChoice(p, d)), 550);
    else if (new Set(G.moves.map(k => p.tok[k])).size === 1) later(() => localMove(G.moves[0]), 350);
  });
}
function onPick(pi, k) {
  if (!canPick(pi, k)) return;
  if (G.mode === "online") { G.moves = []; G.phase = "anim"; place(); return online.act({a: "move", k}); }
  localMove(k);
}
function localMove(k) {
  const pi = G.turn, p = G.players[pi], d = G.dice, from = p.tok[k], to = from < 0 ? 0 : from + d;
  G.phase = "anim";
  const ti = trackIdx(p.c, to), caps = [];
  if (ti >= 0 && !SAFE.has(ti)) G.players.forEach((o, oi) => { if (oi !== pi) o.tok.forEach((q, j) => { if (trackIdx(o.c, q) === ti) caps.push([oi, j]); }); });
  animateMove(pi, k, from, to, caps, () => {
    if (p.tok.every(q => q >= LAST)) return finish(pi);
    later(() => (d === 6 || caps.length || to === LAST) ? again() : nextTurn(), 380);
  });
}
function again() { if (!G || G.over) return; G.phase = "roll"; G.dice = 0; place(); status(); botMaybe(); }
function nextTurn() { if (!G) return; G.sixes = 0; G.turn = (G.turn + 1) % G.players.length; again(); }
function botMaybe() {
  if (!G || G.over || G.mode === "online") return; const p = G.players[G.turn];
  if (!p.bot) return;
  later(localRoll, 650);
  if (rnd() < .07) later(() => bubble(G.turn, pick(REACTS)), 300);
}
function botChoice(p, d) {
  let best = G.moves[0], bs = -1e9;
  for (const k of G.moves) {
    const from = p.tok[k], to = from < 0 ? 0 : from + d, ti = trackIdx(p.c, to);
    let s = to;
    if (to === LAST) s += 1000;
    if (from < 0) s += 400;
    if (ti >= 0 && !SAFE.has(ti) && G.players.some(o => o !== p && o.tok.some(q => trackIdx(o.c, q) === ti))) s += 800;
    if (ti >= 0 && SAFE.has(ti)) s += 120;
    if (to > 50) s += 150;
    if (ti >= 0 && !SAFE.has(ti) && danger(p, ti)) s -= 300;
    if (from >= 0 && from <= 50 && danger(p, trackIdx(p.c, from))) s += 200;
    s += rnd() * 30; if (s > bs) { bs = s; best = k; }
  }
  return best;
}
const danger = (p, ti) => G.players.some(o => o !== p && o.tok.some(q => { const oi = trackIdx(o.c, q); if (oi < 0) return false; const gap = (ti - oi + 52) % 52; return gap >= 1 && gap <= 6; }));

// ---------- الأونلاين: السيرفر يقرر كل شي، واحنا نرسم اللي صار ----------
const online = {
  room: "", v: 0, alive: false, queue: [], applying: false, gen: 0,
  async post(path, body) {
    const r = await fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pid: PID, ...body})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || "net"); e.code = j.error || "net"; throw e; }
    return j;
  },
  async act(b) { try { await this.post("/act", {room: this.room, ...b}); } catch (e) { if (G) { G.phase = G.phase === "rolling" ? "roll" : G.phase; status(); } } },
  async enter(room) {
    const gen = ++this.gen;
    this.room = room; this.v = 0; this.alive = true; this.queue = []; G = null;
    while (this.alive && gen === this.gen) {
      try {
        const r = await fetch(`${API}/state?room=${encodeURIComponent(room)}&pid=${encodeURIComponent(PID)}&v=${this.v}`);
        if (gen !== this.gen) return;
        if (r.status === 403 || r.status === 404) { toast(t().badCode); return goHome(); }
        const s = await r.json(); this.queue.push(s); this.drain(gen);
      } catch (e) { await new Promise(res => setTimeout(res, 1500)); }
    }
  },
  async drain(gen) {
    if (this.applying) return; this.applying = true;
    while (this.queue.length && this.alive && gen === this.gen) await this.apply(this.queue.shift());
    this.applying = false;
  },
  async apply(s) {
    if (G && G.mode === "online" && s.v <= this.v) { timerRing(s.left); return; }
    if (!s.started) { this.v = s.v; if (s.over) { toast(t().badCode); return goHome(); } return lobby(s); }
    if (!G || G.mode !== "online") { this.v = s.v; G = fromState(s); hideSheet(); enterGame(); timerRing(s.left); return this.after(s); }
    for (const e of s.events) {
      if (!this.alive) return;
      if (e.t === "roll") {
        G.turn = e.seat; G.dice = 0; G.phase = "rolling"; status();
        await new Promise(res => spinCube(e.seat, e.d, res)); G.dice = e.d; status();
        if (e.three) say(t().quips.three); else if (e.d === 6) say(t().quips.six);
        if (e.auto && e.seat === G.me) toast(t().auto);
        if (e.none) await new Promise(res => later(res, 500));
      } else if (e.t === "move") {
        G.turn = e.seat; await new Promise(res => animateMove(e.seat, e.k, e.from, e.to, e.caps, res));
      } else if (e.t === "react" && e.seat !== G.me) bubble(e.seat, e.r);
    }
    this.v = s.v;
    const next = fromState(s); next.players.forEach((p, i) => { p.tok = s.tok[i].slice(); });
    G.turn = next.turn; G.dice = next.dice; G.phase = next.phase; G.moves = next.moves;
    G.players.forEach((p, i) => { p.tok = next.players[i].tok; p.gone = next.players[i].gone; });
    place(); status(); timerRing(s.left);
    this.after(s);
  },
  after(s) { if (s.over && !G.over) { this.alive = false; if (s.winner >= 0) finish(s.winner); else goHome(); } },
  stop() { this.alive = false; this.room = ""; this.gen++; }
};
function fromState(s) {
  let bi = 0;
  return {mode: "online", me: s.me, turn: s.turn, dice: s.dice, phase: s.phase, moves: s.moves || [], over: false,
    players: s.seats.map((x, i) => { const fazaa = x.bot && !x.num;
      return {c: x.c, bot: x.bot, fazaa, gone: x.bot && !!x.num, me: x.me, num: x.num, tok: (s.tok[i] || [-1, -1, -1, -1]).slice(),
              name: x.me ? t().you : fazaa ? t().bots[bi++ % 3] : t().anon(x.num)}; })};
}

// ---------- الشاشات ----------
function sheet(html) { $("panel").innerHTML = html; $("panel").onclick = null; $("sheet").hidden = false; }
function hideSheet() { $("sheet").hidden = true; }
$("sheet").onclick = e => { if (e.target.id === "sheet" && !online.alive) { cancelFind(); hideSheet(); } };
let findTimer = 0, findUntil = 0, finding = false;
function startFind() {
  SFX.tap(); finding = true;
  sheet(`<div class="radar">⚡</div><h3 style="text-align:center">${t().searching}</h3><button class="ghost" id="x-cancel">${t().cancel}</button>`);
  $("x-cancel").onclick = () => { cancelFind(); hideSheet(); };
  findUntil = Date.now() + 20000;
  const tick = async () => {
    if (!finding) return;
    try {
      const r = await online.post("/find", {});
      if (!finding) return;
      if (r.status === "matched") { finding = false; hideSheet(); return online.enter(r.room); }
      if (Date.now() > findUntil) return notFound();
      findTimer = setTimeout(tick, 1800);
    } catch (e) { finding = false; hideSheet(); toast(t().offline); }
  };
  tick();
}
function cancelFind() { if (!finding) return; finding = false; clearTimeout(findTimer); online.post("/cancel", {}).catch(() => {}); }
function notFound() {
  cancelFind();
  sheet(`<h3>${t().notFound}</h3><p>${t().findS}</p><div style="height:14px"></div><button class="go red" id="x-bot">${t().tryBot}</button><button class="ghost" id="x-keep">${t().keep}</button>`);
  $("x-bot").onclick = () => { hideSheet(); localGame("bot", 2); };
  $("x-keep").onclick = startFind;
}
function friendSheet() {
  let n = 2;
  const draw = () => {
    sheet(`<h3>${t().friend}</h3><p>${t().players}</p><div class="seg2"><button class="opt ${n === 2 ? "on" : ""}" data-n="2"><span class="dots"><i style="background:${SK.col[0]}"></i><i style="background:${SK.col[2]}"></i></span>${t().two}</button><button class="opt ${n === 4 ? "on" : ""}" data-n="4"><span class="dots">${SK.col.map(c => `<i style="background:${c}"></i>`).join("")}</span>${t().four}</button></div><button class="go red" id="x-create">${t().create}</button>`);
    $("panel").onclick = async e => {
      const o = e.target.closest(".opt"); if (o) { n = +o.dataset.n; SFX.tap(); return draw(); }
      if (e.target.id === "x-create") { try { const r = await online.post("/friend", {n}); online.enter(r.room); } catch (err) { hideSheet(); toast(t().offline); } }
    };
  };
  draw();
}
function lobby(s) {
  const link = `${location.origin}${location.pathname}?r=${s.code}`, mine = s.seats[s.me] && s.seats[s.me].host;
  const avs = [...Array(s.n)].map((_, i) => { const x = s.seats[i]; return x ? `<span class="av" style="background:${SK.col[x.c]}">${x.me ? "✦" : x.num.slice(-2)}</span>` : `<span class="av empty">؟</span>`; }).join("");
  sheet(`<h3>${t().roomCode}</h3><div class="code">${s.code}</div><div class="lob">${avs}</div><p style="text-align:center">${t().waitFriend}</p><div style="height:14px"></div>
    <button class="go red" id="x-share">${t().share}</button>${mine ? `<button class="ghost" id="x-start">${t().startNow}</button>` : ""}<button class="ghost" id="x-out">${t().leave}</button>`);
  $("x-share").onclick = async () => {
    const text = t().shareText + link;
    if (navigator.share) { try { await navigator.share({text}); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(link); toast(t().copied); } catch (e) {}
    open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  };
  if (mine) $("x-start").onclick = () => online.post("/start", {room: s.room}).catch(() => {});
  $("x-out").onclick = () => { online.post("/leave", {room: s.room}).catch(() => {}); online.stop(); hideSheet(); };
}
async function joinCode(code) {
  history.replaceState(null, "", location.pathname);
  try { const r = await online.post("/join", {code}); online.enter(r.room); }
  catch (e) { toast(e.code === "full" ? t().full : e.code === "code" ? t().badCode : t().offline); }
}
function enterGame() {
  $("home").hidden = true; $("game").hidden = false; $("win").classList.remove("on");
  buildTokens(); panels(); $("say").textContent = "";
  $("react").innerHTML = G.mode === "online" ? REACTS.map(r => `<button class="glass">${r}</button>`).join("") : "";
  $("react").querySelectorAll("button").forEach(b => b.onclick = () => { bubble(G.me, b.textContent); online.post("/act", {room: online.room, a: "react", r: b.textContent}).catch(() => {}); });
}
function finish(pi) {
  G.over = true; clearTimers(); status(); timerRing(0);
  const p = G.players[pi], meWon = G.mode === "local" ? !p.bot : pi === G.me;
  let xp = 0;
  if (G.mode !== "local") { P.g++; xp = G.mode === "online" ? (meWon ? 60 : 20) : (meWon ? 30 : 10); if (meWon) P.w++; saveP(); addXP(xp); }
  $("win-text").textContent = t().wins(p.name); $("win-emoji").textContent = meWon ? "🏆" : "🤝";
  $("win-sub").textContent = t().winSub(meWon); $("win-xp").textContent = xp ? t().xp(xp) : "";
  later(() => { $("win").classList.add("on"); if (meWon) { SFX.win(); confetti(); } }, 500);
}
function goHome() {
  online.stop(); cancelFind(); clearTimers(); G = null; busy = false;
  $("win").classList.remove("on"); $("game").hidden = true; $("home").hidden = false; hideSheet(); renderHome();
}
$("leave").onclick = () => {
  if (G && G.mode === "online" && !G.over) { if (!confirm(t().sure)) return; online.post("/leave", {room: online.room}).catch(() => {}); }
  goHome();
};
$("again").onclick = () => { const m = G ? G.mode : "bot", n = G ? G.players.length : 2; if (m === "online") { goHome(); startFind(); } else localGame(m, n); };
$("win-home").onclick = goHome;

// ---------- الرئيسية ----------
function renderHome() {
  const L = level(), lo = lvlFloor(L), hi = lvlFloor(L + 1);
  $("t-lvl").textContent = t().lvl; $("lvl-n").textContent = L; $("xp-i").style.width = Math.round((P.xp - lo) / (hi - lo) * 100) + "%";
  $("lang").textContent = t().lang; $("snd").textContent = sound ? t().on : t().off;
  $("t-hero").innerHTML = t().hero;
  [["t-title", "title"], ["t-sub", "sub"], ["t-find", "find"], ["t-find-s", "findS"], ["t-live", "live"], ["t-friend", "friend"], ["t-friend-s", "friendS"], ["t-bot", "bot"], ["t-bot-s", "botS"],
   ["t-local", "local"], ["t-local-s", "localS"], ["t-skins", "skins"], ["t-stats", "stats"], ["t-w", "w"], ["t-p", "p"], ["t-c", "c"], ["t-rules", "rules"],
   ["leave", "leave"], ["again", "again"], ["win-home", "homeBtn"], ["d-t", "daily"]].forEach(([id, k]) => $(id).textContent = t()[k]);
  $("st-w").textContent = P.w; $("st-p").textContent = P.g; $("st-c").textContent = P.c;
  $("d-s").textContent = P.dc >= DAILY_GOAL ? t().dailyDone : t().dailyS(P.dc, DAILY_GOAL);
  $("d-ring").style.background = `conic-gradient(#ffc933 ${Math.min(1, P.dc / DAILY_GOAL) * 360}deg, rgba(255,255,255,.1) 0)`;
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t().title + (lang === "ar" ? " · Crew Race" : " · سباق الطاقم");
  const pins = $("hero-pins"); pins.innerHTML = "";
  [0, 1, 2, 3].forEach(i => { const s = mk("svg", {viewBox: "-.5 -.75 1 1.15"}, pins); pinSVG(i, s, defs(s, SK), SK); });
  const sk = $("skins"); sk.innerHTML = "";
  SKINS.forEach((x, i) => {
    const b = document.createElement("button"), lock = L < x.lvl;
    b.className = "skin glass" + (P.skin === i ? " on" : "") + (lock ? " lock" : "");
    drawBoard(mk("svg", {viewBox: "0 0 15 15"}, b), x);
    b.append(lock ? t().lockAt(x.lvl) : t().skinNames[i]);
    b.onclick = () => { if (lock) return toast(t().lockAt(x.lvl)); P.skin = i; SK = SKINS[i]; saveP(); SFX.tap(); renderHome(); };
    sk.appendChild(b);
  });
}
$("m-find").onclick = startFind;
$("m-friend").onclick = () => { SFX.tap(); friendSheet(); };
$("m-bot").onclick = () => { SFX.tap(); localGame("bot", 2); };
$("m-local").onclick = () => { SFX.tap(); localGame("local", 4); };
$("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store("race-lang", lang); renderHome(); if (G) status(); };
$("snd").onclick = () => { sound = !sound; store("race-snd", sound ? "1" : "0"); renderHome(); SFX.tap(); };
addEventListener("resize", () => { if (G) fxSize(); });
addEventListener("pagehide", () => { if (finding) cancelFind(); });

renderHome();
if (QS.get("r")) joinCode(QS.get("r"));
})();
